<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Quote Generator</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <main class="container">

        <header>
            <p class="tag">VEDA TECHNOLOGY · TASK 8</p>
            <h1>Random Quote Generator</h1>
            <p class="subtitle">
                A little inspiration for your day ✨
            </p>
        </header>

        <section class="quote-card" aria-live="polite">

            <div class="quote-icon">“</div>

            <p id="quote" class="quote-text">
                Click the button below to discover an inspiring quote.
            </p>

            <p id="author" class="author">— Your daily inspiration</p>

            <div class="divider"></div>

            <div class="buttons">
                <button id="newQuoteBtn" type="button">
                    ✨ New Quote
                </button>

                <button id="copyBtn" class="secondary" type="button">
                    📋 Copy Quote
                </button>

                <button id="shareBtn" class="secondary" type="button">
                    ↗ Share
                </button>
            </div>

            <p id="message" class="message" role="status"></p>

        </section>

        <footer>
            <p>Built with HTML, CSS & JavaScript</p>
            <p>Keep learning. Keep growing. Keep inspiring. 💙</p>
        </footer>

    </main>

</body>
</html>
